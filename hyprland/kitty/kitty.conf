# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #

# you can choose themes from $HOME/.config/kitty/kitty-themes/
include ./kitty-themes/00-Default.conf

font_family FantasqueSansM Nerd Font Mono Bold
font_size 11.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.9
dynamic_background_opacity 1
confirm_os_window_close 0

# Animated cursor
cursor_trail 1

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 4

selection_foreground none
selection_background none

foreground #dddddd
background #000000
cursor #dddddd


# You can still increase / decrease size with KP key
map ctrl+shift+kp_add change_font_size all +2.0	 
map ctrl+shift+kp_subtract change_font_size all -2.0

map ctrl+shift+equal no_op
map ctrl+shift+plus change_font_size no_op
map ctrl+shift+minus no_op
map ctrl+shift+backspace no_op
